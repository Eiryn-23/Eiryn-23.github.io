<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌸 Admin — Pensine Moderne</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#fdf8f5; --blush:#fce8ed; --petal1:#f7c5d0; --petal2:#f2a8bc; --petal3:#e8849e;
      --sakura:#d4607a; --sakura2:#b84468; --text:#3d2b30; --muted:#9b7a82;
      --border:rgba(212,96,122,0.12); --border2:rgba(212,96,122,0.28); --shadow:0 4px 24px rgba(212,96,122,0.08);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; font-weight:300; min-height:100vh; }

    /* LOGIN */
    .login-screen { position:fixed; inset:0; background:var(--bg); z-index:999; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:1.5rem; text-align:center; padding:2rem; }
    .login-screen h1 { font-family:'Cormorant Garamond',serif; font-size:2.5rem; font-weight:300; color:var(--text); }
    .login-screen h1 em { font-style:italic; color:var(--sakura); }
    .login-screen p { font-size:0.85rem; color:var(--muted); }
    .login-input { width:100%; max-width:300px; background:#fff; border:1px solid var(--border2); border-radius:100px; padding:0.85rem 1.4rem; font-family:'DM Sans',sans-serif; font-size:0.9rem; color:var(--text); outline:none; text-align:center; letter-spacing:0.1em; }
    .login-btn { background:var(--sakura); border:none; color:#fff; padding:0.85rem 2rem; border-radius:100px; font-family:'DM Sans',sans-serif; font-size:0.8rem; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; transition:background 0.3s; }
    .login-btn:hover { background:var(--sakura2); }
    .login-error { font-size:0.8rem; color:var(--sakura); display:none; }

    /* MAIN ADMIN */
    .admin-wrap { max-width:700px; margin:0 auto; padding:3rem 2rem 6rem; display:none; }
    .admin-header { text-align:center; margin-bottom:3rem; }
    .admin-header h1 { font-family:'Cormorant Garamond',serif; font-size:2.5rem; font-weight:300; color:var(--text); margin-bottom:0.4rem; }
    .admin-header h1 em { font-style:italic; color:var(--sakura); }
    .admin-header p { font-size:0.85rem; color:var(--muted); }

    /* FORM */
    .form-card { background:#fff; border:1px solid var(--border); border-radius:20px; padding:2.5rem; box-shadow:var(--shadow); margin-bottom:2rem; }
    .form-card h2 { font-family:'Cormorant Garamond',serif; font-size:1.5rem; font-weight:300; color:var(--text); margin-bottom:1.5rem; }
    .form-group { margin-bottom:1.2rem; }
    .form-group label { display:block; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--sakura); margin-bottom:0.4rem; }
    .form-group input, .form-group select, .form-group textarea { width:100%; background:var(--bg); border:1px solid var(--border2); border-radius:10px; padding:0.75rem 1rem; font-family:'DM Sans',sans-serif; font-size:0.85rem; color:var(--text); outline:none; transition:border-color 0.3s; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--sakura); }
    .form-group textarea { resize:vertical; min-height:80px; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    .star-select { display:flex; gap:0.5rem; }
    .star-select button { background:none; border:none; font-size:1.6rem; cursor:pointer; opacity:0.25; transition:opacity 0.2s; }
    .star-select button.on { opacity:1; }

    /* Cover search */
    .cover-row { display:flex; gap:0.8rem; align-items:flex-end; }
    .cover-row .form-group { flex:1; margin-bottom:0; }
    .btn-search { background:var(--blush); border:1px solid var(--border2); color:var(--sakura); padding:0.75rem 1.2rem; border-radius:10px; font-family:'DM Sans',sans-serif; font-size:0.78rem; cursor:pointer; white-space:nowrap; transition:all 0.3s; }
    .btn-search:hover { background:var(--petal1); }
    .cover-preview { display:none; align-items:center; gap:1rem; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:1rem; margin-top:1rem; }
    .cover-preview.visible { display:flex; }
    .cover-preview img { width:60px; border-radius:6px; }
    .cover-preview-info p { font-size:0.8rem; color:var(--text); font-weight:400; }
    .cover-preview-info span { font-size:0.72rem; color:var(--muted); }
    .cover-change { background:none; border:none; color:var(--sakura); font-size:0.72rem; cursor:pointer; text-decoration:underline; margin-top:0.3rem; display:block; }

    .btn-add { width:100%; background:var(--sakura); border:none; color:#fff; padding:1rem; border-radius:100px; font-family:'DM Sans',sans-serif; font-size:0.85rem; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; transition:background 0.3s; margin-top:1.5rem; }
    .btn-add:hover { background:var(--sakura2); }
    .success-msg { display:none; text-align:center; color:var(--sakura); font-size:0.85rem; margin-top:1rem; }

    /* BOOK LIST */
    .book-list { display:flex; flex-direction:column; gap:0.8rem; }
    .book-item { background:#fff; border:1px solid var(--border); border-radius:12px; padding:1rem 1.2rem; display:flex; align-items:center; gap:1rem; box-shadow:var(--shadow); }
    .book-item-cover { width:40px; height:60px; border-radius:6px; object-fit:cover; background:var(--blush); display:flex; align-items:center; justify-content:center; font-size:1.2rem; flex-shrink:0; overflow:hidden; }
    .book-item-cover img { width:100%; height:100%; object-fit:cover; }
    .book-item-info { flex:1; }
    .book-item-title { font-family:'Cormorant Garamond',serif; font-size:1rem; color:var(--text); }
    .book-item-meta { font-size:0.72rem; color:var(--muted); margin-top:0.2rem; }
    .book-item-badge { font-size:0.58rem; letter-spacing:0.1em; text-transform:uppercase; color:#fff; padding:0.15rem 0.5rem; border-radius:100px; }
    .badge-lu{background:var(--sakura)} .badge-encours{background:var(--petal3)} .badge-pal{background:var(--petal2);color:var(--text)} .badge-wishlist{background:#c4a8d4} .badge-coeur{background:#e8849e}
    .btn-delete { background:none; border:1px solid var(--border2); color:var(--muted); padding:0.4rem 0.8rem; border-radius:100px; font-size:0.72rem; cursor:pointer; transition:all 0.3s; flex-shrink:0; }
    .btn-delete:hover { border-color:var(--sakura); color:var(--sakura); }

    .back-link { display:inline-block; margin-bottom:2rem; font-size:0.78rem; color:var(--muted); text-decoration:none; letter-spacing:0.1em; text-transform:uppercase; transition:color 0.3s; }
    .back-link:hover { color:var(--sakura); }

    @media(max-width:768px){ .form-row{grid-template-columns:1fr} }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <h1>🌸 <em>Pensine Moderne</em></h1>
  <p>Espace privé — Entre ton mot de passe pour accéder</p>
  <input type="password" class="login-input" id="pwd-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkPwd()" />
  <button class="login-btn" onclick="checkPwd()">Entrer 🌸</button>
  <p class="login-error" id="login-error">Mot de passe incorrect 🌸</p>
</div>

<!-- ADMIN -->
<div class="admin-wrap" id="admin-wrap">
  <a href="bibliotheque.html" class="back-link">← Retour à la bibliothèque</a>
  <div class="admin-header">
    <h1>🌸 <em>Admin</em></h1>
    <p>Ajoute et gère tes livres ici</p>
  </div>

  <!-- FORMULAIRE -->
  <div class="form-card">
    <h2>Ajouter un livre</h2>

    <div class="cover-row">
      <div class="form-group">
        <label>Titre *</label>
        <input type="text" id="f-titre" placeholder="Titre du livre" />
      </div>
      <button class="btn-search" onclick="searchCover()">🔍 Chercher</button>
    </div>
    <div class="cover-preview" id="cover-preview">
      <div class="book-item-cover"><img id="cover-img" src="" alt="" /></div>
      <div class="cover-preview-info">
        <p id="cover-book-title"></p>
        <span id="cover-book-author"></span>
        <button class="cover-change" onclick="clearCover()">Changer</button>
      </div>
    </div>

    <div class="form-group" id="manual-url-group" style="margin-top:0.8rem;display:none">
      <label>Ou colle une URL d'image manuellement</label>
      <div style="display:flex;gap:0.8rem">
        <input type="url" id="f-manual-url" placeholder="https://..." />
        <button type="button" class="btn-search" onclick="useManualUrl()" style="white-space:nowrap">Utiliser</button>
      </div>
    </div>

    <div class="form-group" style="margin-top:1.2rem">
      <label>Auteur·e *</label>
      <input type="text" id="f-auteur" placeholder="Nom de l'auteur·e" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Genre</label>
        <input type="text" id="f-genre" placeholder="ex: Fantasy" />
      </div>
      <div class="form-group">
        <label>Sous-genre</label>
        <input type="text" id="f-sgenre" placeholder="ex: Dark fantasy" />
      </div>
    </div>

    <div class="form-group">
      <label>Format de lecture</label>
      <select id="f-format">
        <option value="">— Choisir —</option>
        <option value="📱 Ebook">📱 Ebook</option>
        <option value="📗 Livre physique">📗 Livre physique</option>
        <option value="🎧 Audiobook">🎧 Audiobook</option>
        <option value="📲 Nextory">📲 Nextory</option>
        <option value="✍️ Wattpad">✍️ Wattpad</option>
      </select>
    </div>

    <div class="form-group">
      <label>Section *</label>
      <select id="f-section" onchange="toggleFields()">
        <option value="encours">📖 En cours</option>
        <option value="lu">✅ Lu</option>
        <option value="pal">🗂️ PAL</option>
        <option value="wishlist">💫 Wishlist</option>
        <option value="coeur">🩷 Coup de cœur</option>
      </select>
    </div>

    <div id="field-note" style="display:none">
      <div class="form-group">
        <label>Note</label>
        <div class="star-select" id="star-select">
          <button type="button" onclick="setNote(1)">★</button>
          <button type="button" onclick="setNote(2)">★</button>
          <button type="button" onclick="setNote(3)">★</button>
          <button type="button" onclick="setNote(4)">★</button>
          <button type="button" onclick="setNote(5)">★</button>
        </div>
      </div>
      <div class="form-group">
        <label>Mon avis</label>
        <textarea id="f-avis" placeholder="Quelques mots sur ce livre..."></textarea>
      </div>
    </div>

    <div class="form-group" id="field-date" style="display:none">
      <label>Mois de lecture</label>
      <input type="month" id="f-date" />
    </div>

    <div class="form-group" id="field-prog">
      <label>Progression (%)</label>
      <input type="number" id="f-prog" min="0" max="100" placeholder="ex: 45" />
    </div>

    <button class="btn-add" onclick="addBook()">Ajouter le livre 🌸</button>
    <p class="success-msg" id="success-msg">✅ Livre ajouté avec succès !</p>
  </div>

  <!-- LISTE DES LIVRES -->
  <div class="form-card">
    <h2>Mes livres <span id="book-count" style="font-size:1rem;color:var(--muted)"></span></h2>
    <div class="book-list" id="book-list"></div>
  </div>
</div>

<script>
// PASSWORD — change "sakura2026" par ton vrai mot de passe
const PASSWORD = 'sakura2026';

function checkPwd() {
  const val = document.getElementById('pwd-input').value;
  if(val === PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-wrap').style.display = 'block';
    renderList();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('pwd-input').value = '';
    document.getElementById('pwd-input').focus();
  }
}

let books = JSON.parse(localStorage.getItem('pm-books') || '[]');
let currentNote = 0;
let currentCover = '';
function save() { localStorage.setItem('pm-books', JSON.stringify(books)); }

// Cover search — Google Books + Open Library fallback
async function searchCover() {
  const titre = document.getElementById('f-titre').value.trim();
  if(!titre) { alert('Entre d\'abord un titre 🌸'); return; }
  const btn = document.querySelector('.btn-search');
  btn.textContent = '⏳';
  btn.disabled = true;

  let found = false;

  // 1. Essai Google Books (plusieurs résultats)
  try {
    const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(titre)}&maxResults=5&langRestrict=fr`);
    const data = await res.json();
    if(data.items) {
      for(const item of data.items) {
        const book = item.volumeInfo;
        const links = book.imageLinks;
        if(links) {
          const cover = (links.extraLarge || links.large || links.medium || links.thumbnail || links.smallThumbnail || '').replace('http://','https://').replace('zoom=1','zoom=2');
          if(cover) {
            currentCover = cover;
            showCoverPreview(cover, book.title, book.authors ? book.authors[0] : '');
            found = true;
            break;
          }
        }
      }
    }
  } catch(e) { console.log('Google Books error:', e); }

  // 2. Fallback Open Library
  if(!found) {
    try {
      const res = await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(titre)}&limit=5`);
      const data = await res.json();
      if(data.docs && data.docs.length > 0) {
        for(const doc of data.docs) {
          if(doc.cover_i) {
            const cover = `https://covers.openlibrary.org/b/id/${doc.cover_i}-L.jpg`;
            const author = doc.author_name ? doc.author_name[0] : '';
            currentCover = cover;
            showCoverPreview(cover, doc.title, author);
            found = true;
            break;
          }
        }
      }
    } catch(e) { console.log('Open Library error:', e); }
  }

  if(!found) {
    alert('Aucune couverture trouvée 🌸 Tu peux continuer sans, ou coller une URL d\'image manuellement.');
  }

  btn.textContent = '🔍 Chercher';
  btn.disabled = false;
}

function showCoverPreview(cover, title, author) {
  document.getElementById('cover-img').src = cover;
  document.getElementById('cover-book-title').textContent = title;
  document.getElementById('cover-book-author').textContent = author;
  document.getElementById('cover-preview').classList.add('visible');
  if(author && !document.getElementById('f-auteur').value) {
    document.getElementById('f-auteur').value = author;
  }
}

function clearCover() {
  currentCover = '';
  document.getElementById('cover-preview').classList.remove('visible');
  document.getElementById('cover-img').src = '';
  document.getElementById('manual-url-group').style.display = 'block';
  document.getElementById('f-manual-url').value = '';
}

function useManualUrl() {
  const url = document.getElementById('f-manual-url').value.trim();
  if(!url) { alert('Entre une URL d\'image 🌸'); return; }
  currentCover = url;
  showCoverPreview(url, document.getElementById('f-titre').value, '');
  document.getElementById('manual-url-group').style.display = 'none';
}

function setNote(n) {
  currentNote = n;
  document.querySelectorAll('#star-select button').forEach((b,i)=>b.classList.toggle('on',i<n));
}

function toggleFields() {
  const v = document.getElementById('f-section').value;
  document.getElementById('field-note').style.display = (v==='lu'||v==='coeur') ? 'block' : 'none';
  document.getElementById('field-date').style.display = v==='lu' ? 'block' : 'none';
  document.getElementById('field-prog').style.display = v==='encours' ? 'block' : 'none';
  currentNote = 0;
  document.querySelectorAll('#star-select button').forEach(b=>b.classList.remove('on'));
}

function addBook() {
  const titre = document.getElementById('f-titre').value.trim();
  const auteur = document.getElementById('f-auteur').value.trim();
  if(!titre || !auteur) { alert('Titre et auteur·e obligatoires 🌸'); return; }
  const section = document.getElementById('f-section').value;
  books.push({
    id: Date.now(), titre, auteur,
    genre: document.getElementById('f-genre').value.trim(),
    sgenre: document.getElementById('f-sgenre').value.trim(),
    format: document.getElementById('f-format').value,
    section, note: currentNote,
    avis: document.getElementById('f-avis') ? document.getElementById('f-avis').value.trim() : '',
    date: document.getElementById('f-date').value,
    prog: document.getElementById('f-prog').value || 0,
    cover: currentCover
  });
  save(); renderList(); resetForm();
  const msg = document.getElementById('success-msg');
  msg.style.display = 'block';
  setTimeout(()=>msg.style.display='none', 3000);
}

function deleteBook(id) {
  if(!confirm('Supprimer ce livre ? 🌸')) return;
  books = books.filter(b=>b.id!==id);
  save(); renderList();
}

function resetForm() {
  ['f-titre','f-auteur','f-genre','f-sgenre','f-prog','f-avis','f-date'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  document.getElementById('f-section').value='encours';
  document.getElementById('f-format').value='';
  clearCover(); toggleFields(); currentNote=0;
}

const badgeLabels={lu:'Lu',encours:'En cours',pal:'PAL',wishlist:'Wishlist',coeur:'Coup de cœur'};
const icons={lu:'📚',encours:'📖',pal:'🗂️',wishlist:'💫',coeur:'🩷'};

function renderList() {
  document.getElementById('book-count').textContent = `(${books.length})`;
  const list = document.getElementById('book-list');
  if(!books.length) { list.innerHTML = '<p style="color:var(--muted);font-size:0.85rem;text-align:center;padding:2rem">Aucun livre pour le moment 🌸</p>'; return; }
  list.innerHTML = [...books].reverse().map(b => `
    <div class="book-item">
      <div class="book-item-cover">
        ${b.cover ? `<img src="${b.cover}" alt="${b.titre}">` : icons[b.section]||'📚'}
      </div>
      <div class="book-item-info">
        <p class="book-item-title">${b.titre}</p>
        <p class="book-item-meta">${b.auteur} ${b.genre?'· '+b.genre:''} <span class="book-item-badge badge-${b.section}">${badgeLabels[b.section]}</span></p>
      </div>
      <button class="btn-delete" onclick="deleteBook(${b.id})">Supprimer</button>
    </div>`).join('');
}

toggleFields();
</script>
</body>
</html>
