<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article — Pensine Moderne</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#fdf8f5; --blush:#fce8ed; --petal1:#f7c5d0; --petal2:#f2a8bc; --petal3:#e8849e;
      --sakura:#d4607a; --sakura2:#b84468; --text:#3d2b30; --muted:#9b7a82;
      --border:rgba(212,96,122,0.12); --border2:rgba(212,96,122,0.28);
      --shadow:0 4px 24px rgba(212,96,122,0.08);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; font-weight:300; overflow-x:hidden; }
    #petals { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
    .petal { position:absolute; opacity:0; animation:fall linear infinite; }
    @keyframes fall { 0%{transform:translateY(-60px) rotate(0deg);opacity:0} 6%{opacity:0.65} 90%{opacity:0.45} 100%{transform:translateY(105vh) rotate(400deg);opacity:0} }
    @keyframes spin { to{transform:rotate(360deg)} }

    nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:1.3rem 4rem; background:rgba(253,248,245,0.9); backdrop-filter:blur(14px); border-bottom:1px solid var(--border); }
    .nav-logo { font-family:'Cormorant Garamond',serif; font-size:1.25rem; font-weight:400; letter-spacing:0.06em; color:var(--sakura); text-decoration:none; }
    .nav-links { display:flex; gap:2.5rem; list-style:none; }
    .nav-links a { color:var(--muted); text-decoration:none; font-size:0.78rem; letter-spacing:0.12em; text-transform:uppercase; transition:color 0.3s; }
    .nav-links a:hover { color:var(--sakura); }

    .article-wrap { max-width:740px; margin:0 auto; padding:7rem 2rem 6rem; position:relative; z-index:1; }
    .back-link { display:inline-flex; align-items:center; gap:0.4rem; font-size:0.78rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); text-decoration:none; margin-bottom:2.5rem; transition:color 0.3s; }
    .back-link:hover { color:var(--sakura); }

    .article-header { margin-bottom:3rem; }
    .article-meta { display:flex; align-items:center; gap:0.8rem; margin-bottom:1.2rem; }
    .article-category { font-size:0.62rem; letter-spacing:0.14em; text-transform:uppercase; background:var(--blush); color:var(--sakura); padding:0.25rem 0.75rem; border-radius:100px; }
    .article-date { font-size:0.72rem; color:var(--muted); }
    .article-title { font-family:'Cormorant Garamond',serif; font-size:clamp(2rem,5vw,3.2rem); font-weight:300; color:var(--text); line-height:1.15; margin-bottom:1.5rem; }
    .article-image { width:100%; border-radius:16px; margin-bottom:2.5rem; max-height:400px; object-fit:cover; }
    .article-divider { height:1px; background:var(--border); margin-bottom:2.5rem; }

    .article-content { font-size:1rem; line-height:1.9; color:var(--text); }
    .article-content p { margin-bottom:1.5rem; }
    .article-content h2 { font-family:'Cormorant Garamond',serif; font-size:1.8rem; font-weight:300; color:var(--text); margin:2.5rem 0 1rem; }
    .article-content h3 { font-family:'Cormorant Garamond',serif; font-size:1.4rem; font-weight:400; color:var(--sakura); margin:2rem 0 0.8rem; }
    .article-content blockquote { border-left:3px solid var(--petal2); padding-left:1.5rem; margin:2rem 0; font-style:italic; color:var(--muted); font-family:'Cormorant Garamond',serif; font-size:1.2rem; }
    .article-content img { width:100%; border-radius:12px; margin:1.5rem 0; }
    .article-content a { color:var(--sakura); text-decoration:underline; }

    .loading-article { text-align:center; padding:4rem; color:var(--muted); }
    .spinner { width:36px; height:36px; border:2px solid var(--blush); border-top-color:var(--sakura); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 1rem; }

    footer { position:relative; z-index:1; border-top:1px solid var(--border); padding:2.2rem 4rem; display:flex; align-items:center; justify-content:space-between; background:#fff9f7; }
    .footer-name { font-family:'Cormorant Garamond',serif; font-size:1rem; color:var(--sakura); }
    .footer-links { display:flex; gap:2rem; list-style:none; }
    .footer-links a { font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); text-decoration:none; transition:color 0.3s; }
    .footer-links a:hover { color:var(--sakura); }
    .footer-copy { font-size:0.7rem; color:var(--muted); }

    @media(max-width:768px){
      nav{padding:1rem 1.2rem;}
      .nav-links{display:none;}
      .article-wrap{padding:5rem 1.2rem 4rem;}
      footer{flex-direction:column;gap:1rem;text-align:center;padding:1.8rem 1.2rem;}
    }
  </style>
</head>
<body>
<div id="petals"></div>
<nav>
  <a href="index.html" class="nav-logo">Pensine Moderne</a>
  <ul class="nav-links">
    <li><a href="bibliotheque.html">Ma bibliothèque</a></li>
    <li><a href="index.html#articles">Blog</a></li>
    <li><a href="index.html#a-propos">À propos</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>
</nav>

<div class="article-wrap">
  <a href="index.html" class="back-link">← Retour</a>
  <div id="article-content">
    <div class="loading-article">
      <div class="spinner"></div>
      <p>Chargement de l'article 🌸</p>
    </div>
  </div>
</div>

<footer>
  <span class="footer-name">✿ Eiryn Hanami</span>
  <ul class="footer-links">
    <li><a href="index.html#articles">Blog</a></li>
    <li><a href="index.html#a-propos">À propos</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>
  <span class="footer-copy">© 2026 Pensine Moderne 🌸</span>
</footer>

<script>
const pc=document.getElementById('petals');
const cols=['#f7c5d0','#f2a8bc','#fce8ed','#e8849e','#fdf0f3'];
for(let i=0;i<20;i++){const d=document.createElement('div');d.className='petal';const sz=10+Math.random()*16,col=cols[Math.floor(Math.random()*cols.length)];d.innerHTML=`<svg width="${sz}" height="${sz}" viewBox="0 0 40 40"><path d="M20 2 C26 8,36 10,34 20 C32 30,22 36,20 38 C18 36,8 30,6 20 C4 10,14 8,20 2Z" fill="${col}" opacity="0.75"/></svg>`;d.style.left=(Math.random()*102)+'vw';d.style.animation=`fall ${9+Math.random()*10}s linear ${Math.random()*16}s infinite`;pc.appendChild(d);}

const SUPABASE_URL = 'https://tozpnrgbrcaaqfeanwbr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Q5k3MR1qcE5mgyy9A1wZXQ_PyLMKeHW';

async function loadArticle() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if(!id) { window.location.href = 'index.html'; return; }
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/articles?id=eq.${id}&publie=eq.true`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    if(!data.length) { document.getElementById('article-content').innerHTML = '<p style="color:var(--muted);text-align:center">Article introuvable 🌸</p>'; return; }
    const a = data[0];
    const date = new Date(a.created_at);
    const months = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
    const dateStr = months[date.getMonth()] + ' ' + date.getFullYear();
    document.title = a.titre + ' — Pensine Moderne';
    document.getElementById('article-content').innerHTML = `
      <div class="article-header">
        <div class="article-meta">
          ${a.categorie ? `<span class="article-category">${a.categorie}</span>` : ''}
          <span class="article-date">${dateStr}</span>
        </div>
        <h1 class="article-title">${a.titre}</h1>
        ${a.image_url ? `<img src="${a.image_url}" class="article-image" alt="${a.titre}">` : ''}
        <div class="article-divider"></div>
      </div>
      <div class="article-content">${a.contenu || ''}</div>`;
  } catch(e) {
    document.getElementById('article-content').innerHTML = '<p style="color:var(--muted);text-align:center">Impossible de charger l\'article 🌸</p>';
  }
}
loadArticle();
</script>
</body>
</html>
